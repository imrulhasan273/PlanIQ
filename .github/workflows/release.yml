name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
            binary: PlanIQ.exe
            build_args: ''
          - os: ubuntu-latest
            platform: linux-amd64
            binary: PlanIQ
            build_args: '-tags webkit2_41'
          - os: macos-latest
            platform: darwin-universal
            binary: PlanIQ.app
            build_args: '-platform darwin/universal'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build PlanIQ Desktop Binary
        run: wails build -clean ${{ matrix.build_args }}

      - name: Package release archive
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          ARTIFACT_NAME="PlanIQ-${TAG}-${{ matrix.platform }}"
          mkdir -p release-artifacts
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -Command "Compress-Archive -Path 'build/bin/${{ matrix.binary }}' -DestinationPath 'release-artifacts/${ARTIFACT_NAME}.zip'"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            ditto -c -k --sequesterRsrc --keepParent "build/bin/${{ matrix.binary }}" "release-artifacts/${ARTIFACT_NAME}.zip"
          else
            tar -czf "release-artifacts/${ARTIFACT_NAME}.tar.gz" -C build/bin "${{ matrix.binary }}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release & Checksums
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-artifacts
        run: |
          sha256sum PlanIQ-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/PlanIQ-*.zip
            release-artifacts/PlanIQ-*.tar.gz
            release-artifacts/SHA256SUMS.txt
