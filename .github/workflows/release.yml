name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
            binary: PlanIQ.exe
            build_args: ''
          - os: ubuntu-latest
            platform: linux-amd64
            binary: PlanIQ
            build_args: '-tags webkit2_41'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          if [ "$RUNNER_OS" != "Windows" ]; then
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi

      - name: Build PlanIQ Desktop Binary
        run: wails build -clean ${{ matrix.build_args }}

      - name: Package release archive
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          ARTIFACT_NAME="PlanIQ-${TAG}-${{ matrix.platform }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -Command "Compress-Archive -Path 'build/bin/${{ matrix.binary }}' -DestinationPath '${ARTIFACT_NAME}.zip'"
          else
            tar -czf "${ARTIFACT_NAME}.tar.gz" -C build/bin "${{ matrix.binary }}"
          fi

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PlanIQ-*.zip
            PlanIQ-*.tar.gz
